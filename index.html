<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
  import { getAuth, onAuthStateChanged, getIdTokenResult, signOut } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC0xXLWV1JOh2WUpfPsynhFD9jtTZk61A8",
    authDomain: "login-formacion-cab.firebaseapp.com",
    projectId: "login-formacion-cab",
    storageBucket: "login-formacion-cab.firebasestorage.app",
    messagingSenderId: "911638329049",
    appId: "1:911638329049:web:e1292a94f7a470c4e0f0c8",
    measurementId: "G-JLXBNXCDKJ"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  onAuthStateChanged(auth, async (user)=>{
    if(!user){
      const here = location.pathname.split('/').pop() || "index.html";
      return location.replace("login.html?next="+encodeURIComponent(here+location.search));
    }

    const token = await getIdTokenResult(user, true);
    const role  = token.claims.role || (token.claims.admin ? "admin":"user");

    window.CAB    = { uid:user.uid, email:user.email, role };
    window.CAB_NS = "cab_" + user.uid + "_";
    window.logout = () => signOut(auth).then(()=>location.replace("login.html"));

    window.dispatchEvent(new Event("cab-auth-ready"));
  });
</script>

const cuerpos = {

    document.getElementById("ac").textContent = info.ac;
    document.getElementById("pf").textContent = info.pf;
}

/* ================================================
   AGREGAR JUGADOR (con pie hábil + posición)
================================================= */
function addPlayer() {
    const name = byId("name").value.trim();
    const number = byId("number").value.trim();
    const pos = byId("position").value;

    // NUEVOS CAMPOS
    const pie = byId("pieHabil") ? byId("pieHabil").value : "";
    const posicionPrincipal = byId("posicionPrincipal") ? byId("posicionPrincipal").value : "";

    if (!name || !number) {
        alert("Complete nombre y número");
        return;
    }

    if (players.some(p => p.number === number)) {
        alert("Número repetido");
        return;
    }

    const titulares = players.filter(p => p.position === "titular").length;
    const suplentes = players.filter(p => p.position === "suplente").length;

    if (pos === "titular" && titulares >= 11) {
        alert("Máximo 11 titulares.");
        return;
    }
    if (pos === "suplente" && suplentes >= 6) {
        alert("Máximo 6 suplentes.");
        return;
    }

    // 🔵 AGREGAR PIE + POSICIÓN PRINCIPAL AL OBJETO DEL JUGADOR
    players.push({
        name,
        number,
        position: pos,
        pie: pie || "",                  // ← nuevo
        posicionPrincipal: posicionPrincipal || "", // ← nuevo
        x: 0,
        y: 0
    });

    savePlayers(players);
    renderPlayers();

    // LIMPIAR CAMPOS
    byId("name").value = "";
    byId("number").value = "";
    if (byId("pieHabil")) byId("pieHabil").value = "";
    if (byId("posicionPrincipal")) byId("posicionPrincipal").value = "";
}


  /* ================================================
     RENDER DE JUGADORES
  ================================================= */
  function renderPlayers(){
    const field = byId("field");
    const bench = byId("bench");
    field.innerHTML="";
    bench.innerHTML="";

    players.forEach(p=>{
      const c=document.createElement("div");
      c.className="player-container";

      const del=document.createElement("span");
      del.className="delete-x";
      del.textContent="×";
      del.onclick=()=>{
        players = players.filter(x=>x!==p);
        savePlayers(players);
        renderPlayers();
      };
      c.appendChild(del);

      const camiseta=document.createElement("div");
      camiseta.className="player";
      const n=document.createElement("div");
      n.className="player-number";
      n.textContent=p.number;
      camiseta.appendChild(n);

      const nm=document.createElement("div");
      nm.className="player-name";
      nm.textContent=p.name;
      nm.contentEditable=true;
      nm.oninput=()=>{
        p.name = nm.textContent;
        savePlayers(players);
      };

      c.appendChild(camiseta);
      c.appendChild(nm);

      if(p.position==="titular"){
        c.style.left=p.x+"px";
        c.style.top=p.y+"px";
        makeDraggable(c,p);
        field.appendChild(c);
      } else {
        bench.appendChild(c);
      }
    });
  }

  /* ================================================
     DRAG & DROP
  ================================================= */
function makeDraggable(el, p) {

  let isDragging = false;
  let offsetX = 0;
  let offsetY = 0;

  const field = document.getElementById("field");

  function onMouseMove(e) {
    if (!isDragging) return;

    const rect = field.getBoundingClientRect();

    let x = e.clientX - rect.left - offsetX;
    let y = e.clientY - rect.top - offsetY;

    // Limites del campo
    x = Math.max(0, Math.min(x, rect.width - el.offsetWidth));
    y = Math.max(0, Math.min(y, rect.height - el.offsetHeight));

    // Aplicar posición visual
    el.style.left = x + "px";
    el.style.top = y + "px";

    // Guardar en el objeto jugador
    p.x = x;
    p.y = y;
  }

  function onMouseUp() {
    isDragging = false;

    // Remover eventos (evita fugas y conflictos)
    document.removeEventListener("mousemove", onMouseMove);
    document.removeEventListener("mouseup", onMouseUp);

    // Guardar posiciones en storage
    savePlayers(players);
  }

  el.addEventListener("mousedown", (e) => {
    isDragging = true;
    offsetX = e.offsetX;
    offsetY = e.offsetY;

    // Activar eventos mientras se arrastra
    document.addEventListener("mousemove", onMouseMove);
    document.addEventListener("mouseup", onMouseUp);
  });
}

  /* ================================================
     FORMACIONES
  ================================================= */
  function applyFormation(){
    const f = byId("formationSelect").value.split("-").map(Number);
    const titulares = players.filter(p=>p.position==="titular");

    const total = 1 + f.reduce((a,b)=>a+b,0);
    if(titulares.length < total){
      alert("Faltan jugadores para esta formación");
      return;
    }

    const lines=[{count:1,y:440}];
    const [d,m,a] = f;
    lines.push({count:d,y:360});
    lines.push({count:m,y:220});
    lines.push({count:a,y:80});

    let i=0;
    lines.forEach(L=>{
      const spacing = 300/(L.count+1);
      for(let j=0;j<L.count;j++,i++){
        titulares[i].x=spacing*(j+1);
        titulares[i].y=L.y;
      }
    });

    // Guardar formación elegida
    eventInfo.formacion = byId("formationSelect").value;
    saveEventInfo(eventInfo);


    savePlayers(players);
    renderPlayers();
  }

  /* ================================================

  function saveFormationFile(){
    const blob=new Blob([JSON.stringify(players)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="formacion.json";
    a.click();
  }
  function loadFormationFile(){ byId("loadFile").click(); }
  byId("loadFile").addEventListener("change",e=>{
    const f=e.target.files[0];
    if(!f) return;
    const r=new FileReader();
    r.onload=ev=>{
      try{
        players=JSON.parse(ev.target.result);
        savePlayers(players);
        renderPlayers();
      }catch{}
    };
    r.readAsText(f);
  });

  /* ---------- WHATSAPP ---------- */
function sendWhatsApp() {
  const titulo           = (byId("tituloFormacion")?.value || "FORMACIÓN").toUpperCase();
  const formacionTactica = byId("formationSelect")?.value || "";

  const lines = [`*${titulo}*`, ""];
  lines.push(`*Categoría:* ${eventInfo.categoria || "—"}`);
  lines.push(`*Fecha Nº:* ${eventInfo.nFecha || "—"}`);
  lines.push(`*Día:* ${eventInfo.fecha || "—"}`);
  lines.push(`*Hora:* ${eventInfo.hora || "—"}`);
  lines.push(`*Rival:* ${eventInfo.rival || "—"}`);
  lines.push(`*Condición:* ${eventInfo.condicion || "—"}`);
  lines.push(`*Predio:* ${eventInfo.predio || "—"}`);
  lines.push(`*Formación táctica:* ${formacionTactica}`);
  lines.push("");

  const titulares = players.filter(p => p.position === "titular");
  lines.push("*Titulares:*");
  titulares.length ? titulares.forEach(p => lines.push(`${p.number} - ${p.name}`)) : lines.push("—");
  lines.push("");

  const suplentes = players.filter(p => p.position === "suplente");
  lines.push("*Suplentes:*");
  suplentes.length ? suplentes.forEach(p => lines.push(`${p.number} - ${p.name}`)) : lines.push("—");
  lines.push("");

  const dt = byId("dt")?.innerText.trim() || "";
  const ac = byId("ac")?.innerText.trim() || "";
  const pf = byId("pf")?.innerText.trim() || "";
  if (dt || ac || pf) {
    lines.push("*Cuerpo Técnico:*");
    if (dt) lines.push(`DT: ${dt}`);
    if (ac) lines.push(`AC: ${ac}`);
    if (pf) lines.push(`PF: ${pf}`);
  }

  window.open("https://wa.me/?text=" + encodeURIComponent(lines.join("\n")), "_blank");
}
