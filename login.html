<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Ingresar — Formación CAB</title>
<meta http-equiv="Cache-Control" content="no-store" />

<style>
  :root{ color-scheme: light; }
  body{
    font-family:system-ui, Arial, sans-serif;
    display:grid;
    place-items:center;
    min-height:100dvh;
    background:#f5f7fb;
    margin:0;
    padding:20px;
  }

  .wrap{ width:min(420px,94vw); }

  .logo-box{
    text-align:center;
    margin-bottom:20px;
  }
  .logo-box img{
    width:140px;
  }

  .card{
    background:white;
    border-radius:16px;
    padding:22px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
  }

  h1{
    margin:0 0 12px;
    font-size:22px;
    text-align:center;
  }

  label{
    display:block;
    font-size:14px;
    margin:10px 0 4px;
  }

  input{
    width:100%;
    padding:10px;
    border-radius:10px;
    border:1px solid #d0d5dd;
    font-size:15px;
  }

  button{
    width:100%;
    padding:10px 12px;
    margin-top:16px;
    border:0;
    border-radius:12px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    background:#2563eb;
    color:white;
  }

  .hint{
    margin-top:10px;
    font-size:12px;
    color:#6b7280;
    text-align:center;
  }
</style>

<!-- ============================================================
     FIREBASE AUTH + FIRESTORE
============================================================ -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, getIdTokenResult } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC0xXLWV1JOh2WUpfPsynhFD9jtTZk61A8",
    authDomain: "login-formacion-cab.firebaseapp.com",
    projectId: "login-formacion-cab",
    storageBucket: "login-formacion-cab.firebasestorage.app",
    messagingSenderId: "911638329049",
    appId: "1:911638329049:web:e1292a94f7a470c4e0f0c8",
    measurementId: "G-JLXBNXCDKJ"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const AUTH_KEY = "cab_auth";

  function $(id){ return document.getElementById(id); }

  /* ============================================================
     SI YA ESTÁ LOGUEADO → REDIRIGIR
  ============================================================ */
  onAuthStateChanged(auth, async (user)=>{
    if (user){
      const next = new URLSearchParams(location.search).get("next") || "index.html";
      const snap = JSON.parse(localStorage.getItem(AUTH_KEY) || "null");

      if (snap && snap.uid === user.uid){
        location.replace(next);
      }
    }
  });

  /* ============================================================
     LOGIN POR USERNAME
  ============================================================ */
  async function loginWithUsername(e){
    e.preventDefault();

    const username = $("user").value.trim().toLowerCase();
    const password = $("pass").value;

    if (!username || !password){
      alert("Completá usuario y contraseña");
      return;
    }

    const next = new URLSearchParams(location.search).get("next") || "index.html";

    try{
      // 1) username → email
      const ref = doc(db, "usernames", username);
      const snap = await getDoc(ref);

      if (!snap.exists()){
        alert("Usuario no encontrado");
        return;
      }

      const { email } = snap.data();
      if (!email){
        alert("El usuario no tiene email asignado");
        return;
      }

      // 2) Firebase login
      const cred = await signInWithEmailAndPassword(auth, email, password);

      // 3) roles
      const token = await getIdTokenResult(cred.user, true);
      const role = token.claims.role || (token.claims.admin ? "admin":"user");

      // 4) guardar sesión local
      localStorage.setItem(AUTH_KEY, JSON.stringify({
        uid: cred.user.uid,
        username,
        email,
        role,
        ts: Date.now()
      }));

      const redirect = next.includes("?")
        ? `${next}&fromLogin=1`
        : `${next}?fromLogin=1`;

      location.replace(redirect);
    }

    catch(err){
      if (err.code === "auth/wrong-password") return alert("Contraseña incorrecta");
      if (err.code === "auth/too-many-requests") return alert("Demasiados intentos. Probá más tarde.");
      alert("Error al iniciar sesión: " + err.message);
    }
  }

  window.loginWithUsername = loginWithUsername;
</script>

</head>
<body>

<div class="wrap">

  <div class="logo-box">
    <img src="logo.png" alt="CAB">
  </div>

  <div class="card">
    <h1>Ingresar</h1>

    <form onsubmit="loginWithUsername(event)">
      <label for="user">Usuario</label>
      <input id="user" autocomplete="username" required>

      <label for="pass">Contraseña</label>
      <input id="pass" type="password" autocomplete="current-password" required>

      <button type="submit">Entrar</button>

      <p class="hint">Acceso para planillas de Formación CAB</p>
    </form>
  </div>

</div>

</body>
</html>
